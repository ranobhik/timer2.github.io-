name: fetch-banners
on:
  push:
    paths:
      - ".github/workflows/fetch-banners.yml"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать баннеры
        run: |
          python3 - <<'PY'
          import json, urllib.request
          ids = [16498, 40748, 38000, 44511, 1535, 5114, 50265, 33352, 21, 11061]
          out = {}
          for i in ids:
              req = urllib.request.Request(
                  "https://shikimori.one/api/animes/%d" % i,
                  headers={"User-Agent": "rp-banner-bot/1.0 (https://github.com/ranobhik)"},
              )
              try:
                  d = json.load(urllib.request.urlopen(req, timeout=25))
              except Exception as exc:
                  out[str(i)] = {"error": str(exc)}
                  continue
              shots = d.get("screenshots") or []
              poster = (d.get("image") or {}).get("original", "").split("?")[0]
              out[str(i)] = {
                  "banner": ("https://shikimori.one" + shots[0]["original"]) if shots else "",
                  "poster": ("https://shikimori.one" + poster) if poster else "",
                  "mal": d.get("myanimelist_id"),
                  "kind": d.get("kind"),
                  "rating": d.get("rating"),
                  "duration": d.get("duration"),
                  "studio": ((d.get("studios") or [{}])[0] or {}).get("name", ""),
                  "status": d.get("status"),
              }
          open("banners.json", "w").write(json.dumps(out, ensure_ascii=False, indent=2))
          PY
          git config user.name "banners-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B banners
          git add banners.json
          git commit -m "banners"
          git push -f origin banners
