name: probe
on:
  push:
    branches:
      - 'arena/**'
    paths:
      - '.github/workflows/probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run probes
        run: |
          set +e
          OUT=probe-out.txt
          : > $OUT
          T=d6a9c41c60eae7abeb43f91ea50e2302
          echo "== kodik translations" >> $OUT
          curl -s -m 30 -H 'Referer: https://ranobhik.github.io/' "https://kodikapi.com/translations?token=$T&limit=500" -o t.json -w 'HTTP %{http_code}\n' >> $OUT
          head -c 300 t.json >> $OUT; echo >> $OUT
          echo "== kodik search 61999" >> $OUT
          curl -s -m 30 -H 'Referer: https://ranobhik.github.io/' "https://kodikapi.com/search?token=$T&shikimori_id=61999&with_episodes=true&with_seasons=true" -o s.json -w 'HTTP %{http_code}\n' >> $OUT
          head -c 900 s.json >> $OUT; echo >> $OUT
          echo "== kodik list" >> $OUT
          curl -s -m 30 -H 'Referer: https://ranobhik.github.io/' "https://kodikapi.com/list?token=$T&limit=5&types=anime-serial,anime&with_episodes=true" -o l.json -w 'HTTP %{http_code}\n' >> $OUT
          head -c 900 l.json >> $OUT; echo >> $OUT
          echo "== jikan episodes" >> $OUT
          curl -s -m 30 "https://api.jikan.moe/v4/anime/61999/episodes" -o j.json -w 'HTTP %{http_code}\n' >> $OUT
          head -c 600 j.json >> $OUT; echo >> $OUT
          echo "== anilist" >> $OUT
          curl -s -m 30 -X POST "https://graphql.anilist.co" -H 'Content-Type: application/json' -d '{"query":"query{Media(idMal:61999,type:ANIME){episodes streamingEpisodes{title}}}"}' >> $OUT
          echo >> $OUT
          wc -c $OUT
      - name: publish results
        if: always()
        run: |
          set +e
          git config user.name probe
          git config user.email probe@example.com
          git add probe-out.txt
          git commit -m "probe results" || true
          git push
